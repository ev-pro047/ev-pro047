name: Refresh profile visuals

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare generated asset directory
        run: mkdir -p profile-assets

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "Update profile metrics [skip ci]"
          output_action: none
          filename: profile-assets/metrics.svg
          user: ev-pro047
          template: classic
          base: header
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugins_errors_fatal: no

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ev-pro047
          github_token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ev-pro047

      - name: Collect generated assets
        run: |
          mkdir -p profile-assets
          cp dist/github-snake.svg profile-assets/github-snake.svg
          cp dist/github-snake-dark.svg profile-assets/github-snake-dark.svg

      - name: Check public project endpoints
        id: project_status
        env:
          TGDRIVE_URL: https://tgdrive-2f2ed27ee0c2.herokuapp.com
          XYRENLABS_URL: https://xyrenlabs.in
        run: |
          check_url() {
            if curl --fail --location --silent --show-error --max-time 25 "$1" -o /dev/null; then
              echo "online"
            else
              echo "check-failed"
            fi
          }
          echo "tgdrive=$(check_url "$TGDRIVE_URL")" >> "$GITHUB_OUTPUT"
          echo "xyrenlabs=$(check_url "$XYRENLABS_URL")" >> "$GITHUB_OUTPUT"

      - name: Render project status visual
        env:
          TGDRIVE_STATUS: ${{ steps.project_status.outputs.tgdrive }}
          XYRENLABS_STATUS: ${{ steps.project_status.outputs.xyrenlabs }}
        run: |
          mkdir -p profile-assets
          tg_color="#16a34a"
          xy_color="#16a34a"
          [ "$TGDRIVE_STATUS" = "online" ] || tg_color="#d97706"
          [ "$XYRENLABS_STATUS" = "online" ] || xy_color="#d97706"
          cat > profile-assets/project-status.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Project HTTP reachability status">
            <rect width="900" height="150" rx="12" fill="#0f172a"/>
            <text x="28" y="34" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">LIVE PROJECT CHECKS · HTTP REACHABILITY</text>
            <text x="28" y="91" fill="#f8fafc" font-family="Arial,sans-serif" font-size="22" font-weight="600">TG-Drive</text>
            <circle cx="225" cy="83" r="6" fill="$tg_color"/>
            <text x="242" y="89" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">$TGDRIVE_STATUS</text>
            <text x="480" y="91" fill="#f8fafc" font-family="Arial,sans-serif" font-size="22" font-weight="600">XyrenLabs</text>
            <circle cx="680" cy="83" r="6" fill="$xy_color"/>
            <text x="697" y="89" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">$XYRENLABS_STATUS</text>
            <text x="28" y="126" fill="#64748b" font-family="Arial,sans-serif" font-size="11">Automated check · not a full uptime guarantee</text>
          </svg>
          EOF

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No generated assets changed."
            exit 0
          fi
          git commit -m "chore: refresh profile visuals [skip ci]"
          git push origin HEAD:main
