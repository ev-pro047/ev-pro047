name: Refresh profile visuals

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "Update profile metrics [skip ci]"
          output_action: none
          filename: profile-assets/metrics.svg
          user: ev-pro047
          template: classic
          base: header
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugins_errors_fatal: no

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ev-pro047
          github_token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ev-pro047

      - name: Collect generated assets
        run: |
          mkdir -p profile-assets
          cp dist/github-snake.svg profile-assets/github-snake.svg
          cp dist/github-snake-dark.svg profile-assets/github-snake-dark.svg

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No generated assets changed."
            exit 0
          fi
          git commit -m "chore: refresh profile visuals [skip ci]"
          git push origin HEAD:main
